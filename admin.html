<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#050A16">
<meta name="robots" content="noindex">
<title>لوحة التحكم — Card Play</title>
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--bg:#050A16;--card:rgba(16,30,58,.62);--line:rgba(64,140,255,.22);--line2:rgba(64,140,255,.45);--blue:#1E7BFF;--blue2:#4AA3FF;--blue3:#0B5BD9;
  --text:#EAF2FF;--muted:#8EA3C6;--dim:#5B6E92;--ok:#22C55E;--warn:#F5B30B;--err:#F04B4B;--glow:0 0 22px rgba(30,123,255,.38);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;color:var(--text);font-size:14.5px;line-height:1.55;min-height:100vh;
  background:radial-gradient(120% 50% at 50% -10%,rgba(30,123,255,.2),transparent 60%),linear-gradient(180deg,#060C1B,#040812);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1000px;margin:0 auto;padding:14px 14px calc(30px + var(--safe-b))}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header img{height:36px;filter:drop-shadow(0 0 10px rgba(30,123,255,.6))}
header h1{flex:1;font-size:18px;font-weight:800;min-width:0}
header .btn{padding:7px 10px;flex-shrink:0}
@media (max-width:420px){header h1 small{display:none}header h1{font-size:16px}}
header small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px;position:sticky;top:0;z-index:5;background:rgba(5,10,22,.9);backdrop-filter:blur(10px);padding:8px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;padding:8px 13px;border-radius:12px;font-size:13.5px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;gap:6px}
.tabs button.on{background:linear-gradient(135deg,#2C8BFF,var(--blue3));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--err);color:#fff;font-size:11.5px;display:inline-grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{padding:5px 12px;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--muted)}
.chips button.on{border-color:var(--blue);color:#fff;background:rgba(30,123,255,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .top .t{flex:1;min-width:0}
.card b.h{font-size:15px;font-weight:800;display:block}
.card .m{font-size:12.5px;color:var(--muted)}
.card .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.wrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.wchip.on{color:#4ADE80;border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.1)}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#0A1530;border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:800;text-align:center;overflow:hidden}
.kv{display:flex;gap:8px;font-size:13px;margin-top:4px;align-items:center}
.kv span{color:var(--muted);flex-shrink:0}
.kv b{font-weight:700;word-break:break-all}
.cp{color:var(--blue2);font-size:12px;font-weight:800;border:1px solid var(--line);padding:1px 8px;border-radius:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:9px;font-size:12px;font-weight:800;border:1px solid;white-space:nowrap}
.b-done{color:#4ADE80;background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.4)}
.b-pend{color:#FACC15;background:rgba(245,179,11,.13);border-color:rgba(245,179,11,.4)}
.b-proc{color:var(--blue2);background:rgba(30,123,255,.14);border-color:rgba(30,123,255,.45)}
.b-canc{color:#F87171;background:rgba(240,75,75,.13);border-color:rgba(240,75,75,.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:12px;font-weight:800;font-size:13.5px}
.btn.w{width:100%;padding:12px}
.btn-p{background:linear-gradient(135deg,#2C8BFF,var(--blue3));color:#fff;box-shadow:0 6px 18px -8px rgba(30,123,255,.8)}
.btn-o{border:1px solid var(--line2);background:rgba(10,22,46,.6)}
.btn-ok{background:rgba(34,197,94,.18);border:1px solid rgba(34,197,94,.5);color:#4ADE80}
.btn-x{background:rgba(240,75,75,.14);border:1px solid rgba(240,75,75,.45);color:#F87171}
.btn[disabled]{opacity:.5;pointer-events:none}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.inp{width:100%;background:rgba(8,18,40,.8);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;font-size:14.5px}
.inp:focus{border-color:var(--blue)}
textarea.inp{min-height:80px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.row .inp{padding:8px 10px;font-size:13.5px}
.rows-box{border:1px dashed var(--line2);border-radius:14px;padding:10px;margin-bottom:11px}
.rows-box .ri{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.rows-box .ri:last-of-type{border-bottom:none}
.sw{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:11px}
.sw input{width:20px;height:20px;accent-color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.search{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat small{color:var(--muted);font-size:12px}
.sec{font-weight:800;font-size:15.5px;margin:16px 2px 8px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,4,14,.7);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;z-index:41;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,#0C1A38,#070F22);border:1px solid var(--line2);border-bottom:none;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + var(--safe-b))}
.sheet.on{transform:translate(-50%,0)}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-150%);z-index:60;padding:10px 18px;border-radius:13px;background:#0E2148;border:1px solid var(--line2);font-weight:700;transition:.3s;max-width:92%;text-align:center}
#toast.on{transform:translate(-50%,0)}#toast.e{background:#2A0F18;border-color:rgba(240,75,75,.6)}#toast.s{background:#0C2A1C;border-color:rgba(34,197,94,.6)}
.login{max-width:400px;margin:60px auto 0;text-align:center}
.login img{width:110px;filter:drop-shadow(0 0 26px rgba(30,123,255,.55));margin-bottom:10px}
.login h2{margin-bottom:18px}
.preview{width:100%;max-height:160px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:8px}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">
  <section id="login" class="login hidden">
    <img src="img/mark.png" alt="">
    <h2>لوحة تحكم كارد بلاي</h2>
    <form id="lf">
      <div class="fld"><input class="inp" id="lE" type="email" placeholder="البريد الإلكتروني" dir="ltr" required></div>
      <div class="fld"><input class="inp" id="lP" type="password" placeholder="كلمة المرور" required></div>
      <button class="btn btn-p w" id="lB">دخول</button>
    </form>

  <section id="noadmin" class="login hidden">
    <img src="img/mark.png" alt="">
    <h2>هذا الحساب ليس أدمن</h2>
    <p style="color:var(--muted);margin-bottom:10px">انسخ الـ UID هذا وأضفه في Firestore داخل مجموعة <b>admins</b> كمستند بنفس الاسم.</p>
    <div class="card" style="text-align:center"><b class="num" id="myUid" style="word-break:break-all"></b><div style="margin-top:8px"><button class="cp" id="cpUid">نسخ</button></div></div>
    <button class="btn btn-o w" id="out2">تسجيل الخروج</button>
  </section>

  <section id="panel" class="hidden">
    <header><img src="img/mark.png" alt=""><h1>لوحة التحكم<small id="who"></small></h1><button class="btn btn-o" id="nBtn" title="الإشعارات">🔔</button><a class="btn btn-o" href="./" target="_blank">الموقع</a><button class="btn btn-o" id="out">خروج</button></header>
    <nav class="tabs" id="tabs"></nav>
    <main id="main"></main>
  </section>
</div>
<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sh"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc, collection, query, orderBy, limit, onSnapshot,
  runTransaction, serverTimestamp, increment, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getMessaging, getToken, deleteToken, isSupported as fcmSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const fb = initializeApp({
  apiKey: "AIzaSyARNJOPAycWU3YJdZSBN1d9uoLrvso3i4Y",
  authDomain: "cd-card-87365.firebaseapp.com",
  databaseURL: "https://cd-card-87365-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cd-card-87365",
  storageBucket: "cd-card-87365.firebasestorage.app",
  messagingSenderId: "397926299412",
  appId: "1:397926299412:web:2c82ba4a13e3c4f168f401",
  measurementId: "G-F9MNWVD07C"
});
const auth = getAuth(fb), db = getFirestore(fb);

const $ = s => document.querySelector(s);
const iso = s => "\u2068" + s + "\u2069";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = (c, cur="د.ل") => `<span class="num">${((Number(c)||0)/100).toFixed(2)}</span> ${esc(cur)}`;
const DEF_PAYS = [
  {key:"libyana",name:"ليبيانا",sub:"محفظة ليبيانا",cur:"د.ل",color:"#7B2A9E",account:"",note:"حوّل الرصيد للرقم واكتب المبلغ",fields:["sender"],extra:"",enabled:true},
  {key:"almadar",name:"المدار",sub:"محفظة المدار",cur:"د.ل",color:"#0D74D9",account:"",note:"حوّل الرصيد للرقم واكتب المبلغ",fields:["sender"],extra:"",enabled:true},
  {key:"bank",name:"مصرفي",sub:"محفظة مصرفية",cur:"د.ل",color:"#2453B8",account:"",note:"حوّل للحساب وارفع صورة الإيصال",fields:["account","shot"],extra:"",enabled:true},
  {key:"usdt",name:"USDT",sub:"محفظة USDT",cur:"$",color:"#178A6C",account:"",note:"أرسل على شبكة TRC20 فقط",fields:["txid","shot"],extra:"",enabled:true}];
const PAYS = () => (D.settings?.payments?.length ? D.settings.payments : DEF_PAYS);
const WN = k => (PAYS().find(p=>p.key===k)||{}).name || (k==="legacy"?"الرصيد القديم":k||"—");
const WC = k => (PAYS().find(p=>p.key===k)||{}).cur || "د.ل";
const walletChips = u => { const w = u.wallets||{}; return PAYS().map(p=>`<span class="wchip ${(w[p.key]||0)>0?"on":""}">${esc(p.name)}: ${money(w[p.key]||0, p.cur)}</span>`).join("") + (u.balance?`<span class="wchip on">قديم: ${money(u.balance)}</span>`:""); };
const walletsLine = u => { const w = u.wallets||{}; const parts = PAYS().map(p=>`${esc(p.name)}: ${money(w[p.key]||0, p.cur)}`); if (u.balance) parts.push(`قديم: ${money(u.balance)}`); return parts.join(" · "); };
const toCents = v => Math.round(parseFloat(String(v).replace(",", ".")) * 100);
const ms = t => t?.toMillis ? t.toMillis() : 0;
const fdate = t => { const m = ms(t); if (!m) return "—"; const d=new Date(m), p=n=>String(n).padStart(2,"0"); return `\u2066${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}\u2069`; };
let tt; const toast = (m,t="") => { const e=$("#toast"); e.textContent=m; e.className="on "+t; clearTimeout(tt); tt=setTimeout(()=>e.className="",2800); };
const copy = async t => { try{ await navigator.clipboard.writeText(t); toast("تم النسخ ✓","s"); }catch{ toast("تعذر النسخ","e"); } };
window.cp = copy;
const cpb = v => v ? ` <button class="cp" onclick='cp(${JSON.stringify(String(v)).replace(/'/g,"&#39;")})'>نسخ</button>` : "";
const openSheet = h => { $("#sh").innerHTML = h; $("#sh").classList.add("on"); $("#sbg").classList.add("on"); $("#sh").scrollTop=0; };
const closeSheet = () => { openUser = null; $("#sh").classList.remove("on"); $("#sbg").classList.remove("on"); };
window.closeSheet = closeSheet; $("#sbg").onclick = closeSheet;
const busy = async (btn, fn) => { if (btn) btn.disabled = true; try { await fn(); } catch(e){ console.error(e); toast(e.message && e.message.length<70 && !/FirebaseError|permission/i.test(e.message) ? e.message : "حدث خطأ: تحقق من الصلاحيات","e"); } if (btn) btn.disabled = false; };

const CATS = { games:"ألعاب", cards:"بطاقات", subs:"اشتراكات" };
const STATUS = { pending:["قيد التنفيذ","b-pend"], processing:["جاري التنفيذ","b-proc"], done:["مكتمل","b-done"], cancelled:["ملغي","b-canc"] };

/* image → small data URL (no Firebase Storage needed) */
function fileToDataURL(file, maxW, maxH, q=0.82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let { width:w, height:h } = img; const r = Math.min(1, maxW/w, maxH/h); w=Math.round(w*r); h=Math.round(h*r);
      const c = document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      let d = c.toDataURL("image/webp", q); if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", q);
      URL.revokeObjectURL(url); res(d);
    };
    img.onerror = rej; img.src = url;
  });
}

/* ================= auth ================= */
$("#lf").onsubmit = async e => { e.preventDefault(); $("#lErr").textContent=""; try{ await signInWithEmailAndPassword(auth,$("#lE").value.trim(),$("#lP").value); }catch(err){ $("#lErr").textContent="بيانات الدخول غير صحيحة"; } };
$("#gB").onclick = async () => { const p=new GoogleAuthProvider(); try{ await signInWithPopup(auth,p);}catch(err){ if(err.code==="auth/popup-blocked") signInWithRedirect(auth,p); else $("#lErr").textContent="تعذر الدخول بـ Google"; } };
$("#out").onclick = $("#out2").onclick = () => signOut(auth);
$("#cpUid").onclick = () => copy($("#myUid").textContent);

const D = { orders:[], topups:[], tickets:[], products:[], banners:[], users:[], settings:{} };
let unsubs = [], tab = "orders", ofil = "pending", tfil = "pending", kfil = "open", uq = "";
const scr = id => document.querySelectorAll("section").forEach(s => s.classList.toggle("hidden", s.id!==id));

onAuthStateChanged(auth, async u => {
  unsubs.forEach(f=>f()); unsubs=[]; for (const k in seenFirst) delete seenFirst[k];
  if (!u) return scr("login");
  let ok = false;
  try { ok = (await getDoc(doc(db,"admins",u.uid))).exists(); } catch {}
  if (!ok) { $("#myUid").textContent = u.uid; return scr("noadmin"); }
  $("#who").textContent = u.email || "";
  scr("panel");
  const live = (q, key, sort=true) => unsubs.push(onSnapshot(q, s => {
    watchNew(key, s);
    D[key] = s.docs.map(d=>({id:d.id,...d.data()})); if (sort) D[key].sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)); draw();
  }, e => console.error(key, e)));
  live(query(collection(db,"orders"), orderBy("createdAt","desc"), limit(400)), "orders");
  live(query(collection(db,"topups"), orderBy("createdAt","desc"), limit(400)), "topups");
  live(query(collection(db,"tickets"), orderBy("createdAt","desc"), limit(300)), "tickets");
  live(collection(db,"products"), "products", false);
  live(collection(db,"banners"), "banners", false);
  unsubs.push(onSnapshot(doc(db,"settings","app"), s => { D.settings = s.exists()? s.data() : {}; draw(); maybeRefreshFcm(); }));
  unsubs.push(onSnapshot(collection(db,"users"), s => { D.users = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)); draw(); if (openUser) uOpen(openUser, true); }, e => console.error("users", e)));
});
let openUser = null;
async function loadUsers(){}

/* ================= admin notifications ================= */
const lsG = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsS = (k,v) => { try { localStorage.setItem(k,v); } catch {} };
const seenFirst = {};
let swReg = null;
const notifOn = () => lsG("cp_admin_notif") === "1" && "Notification" in window && Notification.permission === "granted";
function nBtnUI(){ const b = $("#nBtn"); if (!b) return; const on = notifOn(); b.textContent = on ? "🔔" : "🔕"; b.style.borderColor = on ? "rgba(34,197,94,.6)" : ""; b.title = on ? "الإشعارات مفعّلة — اضغط للإيقاف" : "تفعيل الإشعارات"; }
async function getSW(){
  if (swReg || !("serviceWorker" in navigator)) return swReg;
  try { swReg = await navigator.serviceWorker.register("sw.js", { scope:"./admin" }); await navigator.serviceWorker.ready; } catch(e){ console.warn(e); }
  return swReg;
}
async function fcmRegister(){
  const vapid = D.settings?.push?.vapid;
  if (!vapid) return "nokey";
  if (!(await fcmSupported().catch(()=>false))) return "unsupported";
  const reg = await getSW(); if (!reg) return "nosw";
  const token = await getToken(getMessaging(fb), { vapidKey: vapid, serviceWorkerRegistration: reg });
  if (!token) return "notoken";
  await setDoc(doc(db, "adminTokens", token), { token, uid: auth.currentUser?.uid || "", ua: navigator.userAgent.slice(0,150), createdAt: serverTimestamp() });
  lsS("cp_admin_fcm", token);
  return "ok";
}
async function fcmUnregister(){
  const t = lsG("cp_admin_fcm"); if (!t) return;
  try { await deleteDoc(doc(db, "adminTokens", t)); } catch {}
  try { await deleteToken(getMessaging(fb)); } catch {}
  lsS("cp_admin_fcm", "");
}
$("#nBtn").onclick = async () => {
  if (!("Notification" in window)) return toast("المتصفح هذا ما يدعمش الإشعارات","e");
  if (notifOn()) { lsS("cp_admin_notif","0"); await fcmUnregister(); nBtnUI(); return toast("تم إيقاف الإشعارات","s"); }
  const p = await Notification.requestPermission();
  if (p !== "granted") return toast("لازم تسمح بالإشعارات من إعدادات المتصفح","e");
  lsS("cp_admin_notif","1"); await getSW(); nBtnUI(); beep();
  let r = "err"; try { r = await fcmRegister(); } catch(e){ console.error(e); }

    <p style="color:var(--muted);margin-bottom:10px">${esc(o.productName)} — ${esc(o.optionLabel)}${o.input?` · ${esc(o.input)}`:""}</p>
    <div class="fld"><label>الكود / بيانات التسليم (تظهر للعميل مع زر نسخ)</label><textarea class="inp" id="dv" placeholder="مثال: XXXX-XXXX-XXXX أو: تم الشحن على الـ ID">${esc(o.delivery||"")}</textarea></div>
    <div class="fld"><label>ملاحظة للعميل (اختياري)</label><input class="inp" id="dn" value="${esc(o.adminNote||"")}"></div>
    <button class="btn btn-ok w" id="dB">تأكيد التنفيذ</button>`);
  $("#dB").onclick = () => busy($("#dB"), async () => { await updateDoc(doc(db,"orders",id), { status:"done", delivery:$("#dv").value.trim(), adminNote:$("#dn").value.trim(), updatedAt:serverTimestamp() }); closeSheet(); toast("تم التنفيذ ✓","s"); });
};
window.oCancel = id => {
  const o = D.orders.find(x=>x.id===id);
  openSheet(`<h3>إلغاء الطلب #${esc(o.no)}<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <p style="margin-bottom:10px">سيتم إرجاع ${money(o.price, o.cur)} لمحفظة ${esc(WN(o.wallet||"legacy"))} عند ${esc(o.uName)}.</p>
    <div class="fld"><label>سبب الإلغاء (يظهر للعميل)</label><input class="inp" id="cn" placeholder="مثال: الـ ID غير صحيح"></div>
    <button class="btn btn-x w" id="cB">إلغاء واسترجاع المبلغ</button>`);
  $("#cB").onclick = () => busy($("#cB"), async () => {
    await runTransaction(db, async tx => {
      const r = doc(db,"orders",id), s = await tx.get(r); const d = s.data();
      if (d.status==="cancelled") throw new Error("الطلب ملغي مسبقاً");
      tx.update(r, { status:"cancelled", refunded:true, adminNote:$("#cn").value.trim(), updatedAt:serverTimestamp() });
      tx.update(doc(db,"users",d.uid), d.wallet ? { ["wallets."+d.wallet]: increment(d.price) } : { balance: increment(d.price) });
    });
    closeSheet(); toast("تم الإلغاء والاسترجاع ✓","s");
  });
};
window.viewShot = id => { const t = D.topups.find(x=>x.id===id); openSheet(`<h3>صورة الإيصال<button class="btn btn-o" onclick="closeSheet()">✕</button></h3><img src="${esc(t.shot)}" style="width:100%;border-radius:12px">`); };
window.tApprove = id => {
  const t = D.topups.find(x=>x.id===id);
  openSheet(`<h3>قبول طلب الشحن<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <p style="margin-bottom:10px">${esc(t.uName)} (<span class="num">${esc(t.uShort)}</span>) · محفظة ${esc(t.methodName)}${t.note?` · ${esc(t.note)}`:""}</p>
    ${Object.entries(t.fields||{}).map(([k,v])=>`<div class="kv"><span>${esc(k)}:</span><b class="num">${esc(v)}</b></div>`).join("")}
    ${t.shot?`<img src="${esc(t.shot)}" style="width:100%;max-height:340px;object-fit:contain;border-radius:12px;margin:10px 0;border:1px solid var(--line)">`:""}
    <div class="fld"><label>المبلغ الذي سيضاف (${esc(t.cur||WC(t.wallet||t.method))}) — عدّله لو المحوَّل مختلف</label><input class="inp num" id="ta" type="number" step="0.01" value="${(t.amount/100).toFixed(2)}"></div>
    <button class="btn btn-ok w" id="aB">قبول وإضافة الرصيد</button>`);
  $("#aB").onclick = () => busy($("#aB"), async () => {
    const amount = toCents($("#ta").value); if (!(amount>0)) throw new Error("مبلغ غير صحيح");
    await runTransaction(db, async tx => {
      const r = doc(db,"topups",id), s = await tx.get(r);
      if (s.data().status!=="pending") throw new Error("تمت معالجة الطلب مسبقاً");
      tx.update(r, { status:"approved", amount, updatedAt:serverTimestamp() });
      tx.update(doc(db,"users",s.data().uid), { ["wallets."+(s.data().wallet||s.data().method)]: increment(amount) });
    });
    closeSheet(); toast("تمت إضافة الرصيد ✓","s"); loadUsers();
  });
};
window.tReject = id => {
  openSheet(`<h3>رفض طلب الشحن<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <div class="fld"><label>السبب (يظهر للعميل)</label><input class="inp" id="rn" placeholder="مثال: لم يصلنا التحويل"></div><button class="btn btn-x w" id="rB">رفض</button>`);
  $("#rB").onclick = () => busy($("#rB"), async () => { await updateDoc(doc(db,"topups",id), { status:"rejected", adminNote:$("#rn").value.trim(), updatedAt:serverTimestamp() }); closeSheet(); toast("تم الرفض","s"); });
};

const uBalHTML = u => PAYS().map(p=>`<div class="kv"><span>محفظة ${esc(p.name)}:</span><b>${money((u.wallets||{})[p.key]||0, p.cur)}</b></div>`).join("") + (u.balance?`<div class="kv"><span>الرصيد القديم:</span><b>${money(u.balance)}</b></div>`:"");
window.uOpen = (id, refresh) => {
  const u = D.users.find(x=>x.id===id); if (!u) return; const oc = D.orders.filter(o=>o.uid===id);
  if (refresh) { const box = document.getElementById("uBal"); if (box && $("#sh").classList.contains("on")) box.innerHTML = uBalHTML(u); return; }
  openUser = id;
  openSheet(`<h3>${esc(u.name)}<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <div class="kv"><span>ID:</span><b class="num">${esc(u.short)}</b>${cpb(u.short)}</div>
    <div class="kv"><span>البريد:</span><b>${esc(u.email)}</b></div>
    <div class="kv"><span>الهاتف:</span><b class="num">${esc(u.phone||"—")}</b>${cpb(u.phone)}</div>
    <div id="uBal">${uBalHTML(u)}</div>
    <div class="kv"><span>عدد الطلبات:</span><b>${oc.length}</b></div>
    <div class="kv"><span>UID:</span><b class="num" style="font-size:11px">${esc(u.id)}</b>${cpb(u.id)}</div>
    <div class="sec">تعديل الرصيد يدوياً</div>
    <div class="fld"><label>المحفظة</label><select class="inp" id="uw">${PAYS().map(p=>`<option value="${esc(p.key)}">${esc(p.name)} (${esc(p.cur||"د.ل")})</option>`).join("")}</select></div>
    <div class="g2"><div class="fld"><label>المبلغ</label><input class="inp num" id="ua" type="number" step="0.01" placeholder="مثال: 10"></div>
    <div class="fld"><label>ملاحظة</label><input class="inp" id="un" placeholder="مثال: تعويض"></div></div>
    <div class="g2"><button class="btn btn-ok w" id="uAdd">إضافة +</button><button class="btn btn-x w" id="uSub">خصم −</button></div>`);
  const adj = sign => busy(null, async () => {
    const v = toCents($("#ua").value); if (!(v>0)) throw new Error("اكتب مبلغ صحيح");
    const amount = sign*v, w = $("#uw").value;
    await runTransaction(db, async tx => {
      const ur = doc(db,"users",id), us = await tx.get(ur);
      if (((us.data().wallets||{})[w]||0) + amount < 0) throw new Error("رصيد المحفظة لا يكفي للخصم");
      tx.set(doc(collection(db,"topups")), { uid:id, uName:u.name||"", uShort:u.short||"", method:"admin", methodName:"الإدارة", wallet:w, cur:WC(w), amount, note:$("#un").value.trim(), status:"approved", createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
      tx.update(ur, { ["wallets."+w]: increment(amount) });
    });
    closeSheet(); toast("تم تعديل الرصيد ✓","s"); loadUsers();
  });
  $("#uAdd").onclick = () => adj(1); $("#uSub").onclick = () => adj(-1);
};

window.kReply = id => {
  const t = D.tickets.find(x=>x.id===id);
  openSheet(`<h3>الرد على التذكرة<button class="btn btn-o" onclick="closeSheet()">✕</button></h3><p style="color:var(--muted);margin-bottom:10px;white-space:pre-line">${esc(t.message)}</p>
    <div class="fld"><textarea class="inp" id="kr" placeholder="اكتب ردك...">${esc(t.reply||"")}</textarea></div>
    <label class="sw"><input type="checkbox" id="kc" checked> إغلاق التذكرة بعد الرد</label><button class="btn btn-p w" id="kB">إرسال الرد</button>`);
  $("#kB").onclick = () => busy($("#kB"), async () => { await updateDoc(doc(db,"tickets",id), { reply:$("#kr").value.trim(), status:$("#kc").checked?"closed":"open", updatedAt:serverTimestamp() }); closeSheet(); toast("تم الإرسال ✓","s"); });
};
window.kClose = id => busy(null, async () => { await updateDoc(doc(db,"tickets",id), { status:"closed", updatedAt:serverTimestamp() }); });

/* products */
window.pEdit = id => {
  const p = id ? D.products.find(x=>x.id===id) : { category:"games", active:true, options:[{label:"",price:""}], sort:(D.products.length+1) };
  let img = p.image || "";
  openSheet(`<h3>${id?"تعديل منتج":"منتج جديد"}<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <div class="fld"><label>اسم المنتج</label><input class="inp" id="pn" value="${esc(p.name||"")}" placeholder="مثال: PUBG UC"></div>
    <div class="g2"><div class="fld"><label>القسم</label><select class="inp" id="pc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.category===k?"selected":""}>${v}</option>`).join("")}</select></div>
    <div class="fld"><label>الترتيب</label><input class="inp num" id="ps" type="number" value="${esc(p.sort??"")}"></div></div>
    <div class="fld"><label>وصف (اختياري)</label><textarea class="inp" id="pd" style="min-height:60px">${esc(p.description||"")}</textarea></div>
    <div class="fld"><label>الصورة (مربعة) — ارفع من الجهاز أو حط رابط</label><input class="inp" id="pf" type="file" accept="image/*"><input class="inp" id="pu" style="margin-top:6px" placeholder="أو رابط صورة https://..." dir="ltr" value="${img.startsWith("http")?esc(img):""}">
      <div id="pv">${img?`<img class="preview" style="width:110px;height:110px" src="${esc(img)}">`:""}</div>${img?`<button type="button" class="btn btn-x" style="margin-top:6px" id="pr">حذف الصورة</button>`:""}</div>
    <label class="sw"><input type="checkbox" id="pi" ${p.needsInput?"checked":""}> يحتاج إدخال من العميل (مثل ID اللاعب)</label>
    <div class="g2" id="piBox" ${p.needsInput?"":'style="display:none"'}><div class="fld"><label>عنوان الحقل</label><input class="inp" id="pil" value="${esc(p.inputLabel||"ID اللاعب")}"></div><div class="fld"><label>نص توضيحي</label><input class="inp" id="pih" value="${esc(p.inputHint||"")}" placeholder="مثال: 5123456789"></div></div>
    <label class="sw"><input type="checkbox" id="pa" ${p.active!==false?"checked":""}> ظاهر في الموقع</label>
    <div class="sec">الباقات والأسعار</div>
    <p class="m" style="color:var(--muted);margin:-4px 2px 8px">حط سعر لكل محفظة. اللي تخليه فاضي، الباقة ما تظهرش لأصحاب المحفظة هذي.</p>
    ${rows("popts", OPT_F_(), (p.options||[]).map(o => { const r = { label:o.label }; PAYS().forEach(w => { const v = optPrice(o,w.key); if (v) r["p_"+w.key] = v; }); return r; }))}
    <button class="btn btn-p w" id="pB">حفظ المنتج</button>`);
  $("#pi").onchange = () => $("#piBox").style.display = $("#pi").checked ? "" : "none";
  $("#pf").onchange = async () => { const f=$("#pf").files[0]; if(!f) return; img = await fileToDataURL(f, 320, 320, .82); $("#pu").value=""; $("#pv").innerHTML=`<img class="preview" style="width:110px;height:110px" src="${img}">`; };
  $("#pr") && ($("#pr").onclick = () => { img=""; $("#pu").value=""; $("#pv").innerHTML=""; });
  $("#pB").onclick = () => busy($("#pB"), async () => {
    const name = $("#pn").value.trim(); if (!name) throw new Error("اكتب اسم المنتج");
    const options = readRows("popts").filter(o=>o.label).map(r => { const prices = {};
      PAYS().forEach(w => { const v = r["p_"+w.key]; if (v > 0) prices[w.key] = v; }); return { label:r.label, prices }; })
      .filter(o => Object.keys(o.prices).length);
    if (!options.length) throw new Error("أضف باقة واحدة على الأقل بسعر في محفظة وحدة على الأقل");
    const url = $("#pu").value.trim(); if (url) img = url;
    const data = { name, category:$("#pc").value, sort:Number($("#ps").value)||0, description:$("#pd").value.trim(), image:img,
      needsInput:$("#pi").checked, inputLabel:$("#pil").value.trim(), inputHint:$("#pih").value.trim(), active:$("#pa").checked, options, updatedAt:serverTimestamp() };
    if (id) await updateDoc(doc(db,"products",id), data); else await addDoc(collection(db,"products"), { ...data, createdAt:serverTimestamp() });
    closeSheet(); toast("تم حفظ المنتج ✓","s");
  });
};
window.pToggle = id => { const p=D.products.find(x=>x.id===id); busy(null, ()=>updateDoc(doc(db,"products",id), { active: p.active===false })); };
window.pDel = id => { if (confirm("حذف المنتج نهائياً؟")) busy(null, async()=>{ await deleteDoc(doc(db,"products",id)); toast("تم الحذف","s"); }); };

/* banners */
window.bEdit = id => {
  const b = id ? D.banners.find(x=>x.id===id) : { active:true, sort:D.banners.length+1, cta:"اكتشف المزيد" };
  let img = b.image || "";
  const linkOpts = [["","بدون"],...Object.entries(CATS).map(([k,v])=>[k,"قسم: "+v]),...D.products.map(p=>[p.id,"منتج: "+p.name])];
  const isUrl = /^https?:/.test(b.link||"");
  openSheet(`<h3>${id?"تعديل بانر":"بانر جديد"}<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <div class="fld"><label>الصورة (عرضية 2:1)</label><input class="inp" id="bf" type="file" accept="image/*"><div id="bv">${img?`<img class="preview" src="${esc(img)}">`:""}</div></div>
    <div class="fld"><label>العنوان</label><input class="inp" id="bt" value="${esc(b.title||"")}" placeholder="اشحن ألعابك الآن"></div>
    <div class="fld"><label>النص الفرعي</label><input class="inp" id="bs" value="${esc(b.subtitle||"")}" placeholder="بأسرع وأسهل طريقة"></div>
    <div class="g2"><div class="fld"><label>نص الزر</label><input class="inp" id="bc" value="${esc(b.cta||"")}"></div><div class="fld"><label>الترتيب</label><input class="inp num" id="bo" type="number" value="${esc(b.sort??"")}"></div></div>
    <div class="fld"><label>الزر يفتح</label><select class="inp" id="bl">${linkOpts.map(([k,v])=>`<option value="${esc(k)}" ${b.link===k?"selected":""}>${esc(v)}</option>`).join("")}<option value="__url" ${isUrl?"selected":""}>رابط خارجي</option></select>
      <input class="inp" id="bu" dir="ltr" style="margin-top:6px;${isUrl?"":"display:none"}" placeholder="https://..." value="${isUrl?esc(b.link):""}"></div>
    <label class="sw"><input type="checkbox" id="ba" ${b.active!==false?"checked":""}> ظاهر</label>
    <button class="btn btn-p w" id="bB">حفظ البانر</button>`);
  $("#bl").onchange = () => $("#bu").style.display = $("#bl").value==="__url" ? "" : "none";
  $("#bf").onchange = async () => { const f=$("#bf").files[0]; if(!f) return; img = await fileToDataURL(f, 1000, 600, .8); $("#bv").innerHTML=`<img class="preview" src="${img}">`; };
  $("#bB").onclick = () => busy($("#bB"), async () => {
    if (!img) throw new Error("اختر صورة للبانر");
    const link = $("#bl").value==="__url" ? $("#bu").value.trim() : $("#bl").value;
    const data = { image:img, title:$("#bt").value.trim(), subtitle:$("#bs").value.trim(), cta:$("#bc").value.trim(), link, sort:Number($("#bo").value)||0, active:$("#ba").checked, updatedAt:serverTimestamp() };
    if (id) await updateDoc(doc(db,"banners",id), data); else await addDoc(collection(db,"banners"), data);
    closeSheet(); toast("تم الحفظ ✓","s");
  });
};
window.bDel = id => { if (confirm("حذف البانر؟")) busy(null, ()=>deleteDoc(doc(db,"banners",id))); };

/* seed demo data */
window.seed = () => busy(null, async () => {
  if (!confirm("إضافة منتجات وإعدادات تجريبية؟ (الأسعار تجريبية، عدّلها بعدين)")) return;
  const PR = p => ({ libyana:Math.round(p*125), almadar:Math.round(p*125), bank:Math.round(p*100), usdt:Math.round(p*100/7) });
  const P = (name, category, sort, options, needsInput=false, inputLabel="") => ({ name, category, sort, options: options.map(([label,p])=>({label, prices:PR(p)})),
    needsInput, inputLabel, inputHint:"", description:"", image:"", active:true, createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
  const items = [
    P("PUBG UC","games",1,[["60 UC",6.5],["325 UC",32],["660 UC",63],["1800 UC",160]],true,"ID اللاعب"),
    P("فري فاير","games",2,[["100 جوهرة",4.9],["310 جوهرة",14.5],["520 جوهرة",24]],true,"ID اللاعب"),
    P("iTunes","cards",3,[["$5",30],["$10",58],["$25",142]]),
    P("Google Play","cards",4,[["$5",30],["$10",58],["$25",142]]),
    P("PlayStation","cards",5,[["$10",60],["$25",148],["$50",292]]),
    P("شحن اللعب","games",6,[["باقة صغيرة",6],["باقة متوسطة",15]],true,"ID اللاعب"),
    P("نتفليكس","subs",7,[["شهر — بروفايل",25],["شهر — حساب كامل",75]],true,"البريد الإلكتروني"),
    P("شاهد VIP","subs",8,[["شهر",20],["3 شهور",55]]),
    P("Spotify Premium","subs",9,[["شهر",18],["3 شهور",50]])
  ];
  const b = writeBatch(db);
  items.forEach(it => b.set(doc(collection(db,"products")), it));
  if (!D.settings?.payments?.length) b.set(doc(db,"settings","app"), {
    payments:DEF_PAYS,
    channels:[{type:"telegram",title:"قناتنا على تيليجرام",handle:"@cardplay",url:"https://t.me/cardplay",btn:""},
      {type:"whatsapp",title:"قناة واتساب",handle:"تواصل معنا مباشرة",url:"https://wa.me/",btn:"افتح"},
      {type:"instagram",title:"حسابنا على انستقرام",handle:"@cardplay",url:"https://instagram.com/cardplay",btn:""},
      {type:"facebook",title:"صفحتنا على فيسبوك",handle:"Card Play",url:"https://facebook.com/",btn:""}],
    support:{ whatsapp:"", telegram:"" },
    faq:[{q:"كيف أشحن رصيدي؟",a:"من المحفظة اضغط شحن الرصيد، اختر طريقة الدفع، حوّل المبلغ واكتب بيانات التحويل. يضاف الرصيد بعد المراجعة."},
      {q:"ما هي طرق الدفع المتاحة؟",a:"ليبيانا، المدار، التحويل المصرفي، و USDT."},
      {q:"كم يستغرق وصول الطلب؟",a:"أغلب الطلبات تُنفذ خلال دقائق، وقد تصل إلى ساعات في أوقات الضغط."},
      {q:"هل يمكنني استرجاع المبلغ؟",a:"إذا تم إلغاء طلبك يرجع المبلغ تلقائياً لمحفظتك."}],
    updatedAt:serverTimestamp() });
  await b.commit(); toast("تمت إضافة البيانات التجريبية ✓","s");
});
</script>
