function fileToDataURL(file, maxW, maxH, q=0.82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let { width:w, height:h } = img; const r = Math.min(1, maxW/w, maxH/h); w=Math.round(w*r); h=Math.round(h*r);

async function api(action, extra = {}){
  const url = D.settings?.push?.worker;
  if (!url) throw new Error("مفتاح 1 غير مضبوط في الإعدادات");
  const idToken = await auth.currentUser.getIdToken();
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify({ action, idToken, ...extra }) });
  const j = await r.json().catch(()=>({}));
  if (r.status === 401 || r.status === 403) throw new Error("ما عندكش صلاحية لهذي العملية");
  if (!j.ok && j.error) throw new Error("حدث خطأ في الاتصال بالمزوّد");
  return j;
}

  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+.45); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.5); } catch {} }

/* generic row editor */
const PAY_F = [["key","النوع","sel",[["libyana","ليبيانا"],["almadar","المدار"],["bank","مصرفي"],["usdt","USDT"],["other","أخرى 1"],["other2","أخرى 2"]]],["name","الاسم"],["sub","وصف قصير"],["cur","العملة (د.ل أو $)"],["color","لون الكرت","color"],["account","رقم الحساب / المحفظة"],["note","تعليمات للعميل","ta"],
  ["fields","الحقول المطلوبة عند الشحن (المبلغ دايماً موجود)","multi",[["sender","الرقم المحوَّل منه"],["account","رقم الحساب المحوَّل منه"],["name","اسم المحوِّل"],["txid","رقم العملية TxID"],["shot","صورة الإيصال (سكرين)"]]],
  ["extra","حقول إضافية — اكتب كل حقل في سطر (اختياري)","ta"],["enabled","مفعّل","chk"]];
const CH_F = [["type","النوع","sel",[["telegram","تيليجرام"],["whatsapp","واتساب"],["instagram","انستقرام"],["facebook","فيسبوك"],["tiktok","تيك توك"],["link","رابط"]]],["title","العنوان"],["handle","اليوزر / الوصف"],["url","الرابط"],["btn","نص الزر (اختياري)"]];
const TYPE_F = [["name","الاسم"],["icon","الأيقونة","sel",[["game","🎮 ألعاب"],["card","💳 كروت"],["sim","📱 شريحة/محلي"],["star","☁️ اشتراكات"],["apps","📲 تطبيقات"],["grid","▦ عام"],["cart","🛒 تسوق"],["wallet","👛 محفظة"]]],["key","","hidden"]];
const FAQ_F = [["q","السؤال"],["a","الجواب","ta"]];
const optPrice = (o, k) => Number(o?.prices && (k in o.prices) ? o.prices[k] : (o?.price || 0)) || 0;
const OPT_F_ = () => [["label","اسم الباقة"], ...PAYS().map(p => ["p_"+p.key, `سعر ${p.name} (${p.cur||"د.ل"})`, "money"]), ...(D.settings?.supplier?.enabled ? [["supj","ربط بمنتج المزوّد (تنفيذ تلقائي)","sup"]] : [])];
function fieldHTML([k,l,t,opts], v){
  if (t==="sel") return `<div class="fld"><label>${l}</label><select class="inp" data-k="${k}">${opts.map(([a,b])=>`<option value="${a}" ${v===a?"selected":""}>${b}</option>`).join("")}</select></div>`;
  if (t==="hidden") return `<input type="hidden" data-k="${k}" value="${esc(v||"")}">`;
  if (t==="sup") { let o = null; try { o = v ? JSON.parse(v) : null; } catch {}
    return `<div class="fld supf"><label>${l}</label><input type="hidden" data-k="${k}" value="${esc(v||"")}">
      <div class="suprow"><span class="supname">${o ? `🔗 ${esc(o.name)} <small>(${esc(o.type==="digital"?"رقمي":"شحن مباشر")} · تكلفة ${esc(o.cost)} ${esc(o.cur||"")})</small>` : `<small style="color:var(--dim)">غير مربوطة — تنفيذ يدوي</small>`}</span>
      <button type="button" class="btn btn-o" onclick="supPick(this)">${o?"تغيير":"اختيار"}</button>${o?`<button type="button" class="btn btn-x" onclick="supClear(this)">فك</button>`:""}</div></div>`; }
  if (t==="color") return `<div class="fld"><label>${l}</label><input class="inp" data-k="${k}" type="color" value="${esc(v||"#2453B8")}" style="height:44px;padding:4px"></div>`;
  if (t==="multi") { const arr = Array.isArray(v) ? v : []; return `<div class="fld"><label>${l}</label><div style="display:flex;flex-wrap:wrap;gap:4px 14px">${opts.map(([a,b])=>`<label class="sw" style="margin:0"><input type="checkbox" data-k="${k}" data-mv="${a}" ${arr.includes(a)?"checked":""}> ${b}</label>`).join("")}</div></div>`; }
  if (t==="chk") return `<label class="sw"><input type="checkbox" data-k="${k}" ${v!==false?"checked":""}> ${l}</label>`;
  if (t==="ta") return `<div class="fld"><label>${l}</label><textarea class="inp" data-k="${k}" style="min-height:60px">${esc(v)}</textarea></div>`;
  if (t==="num") return `<div class="fld"><label>${l}</label><input class="inp num" data-k="${k}" data-num="1" type="number" step="0.0001" inputmode="decimal" value="${v!=null&&v!==""?esc(v):"1"}"></div>`;
  if (t==="money") return `<div class="fld"><label>${l}</label><input class="inp num" data-k="${k}" data-money="1" type="number" step="0.01" inputmode="decimal" value="${v?(v/100).toFixed(2):""}"></div>`;
  return `<div class="fld"><label>${l}</label><input class="inp" data-k="${k}" value="${esc(v)}"></div>`;
}
function rowItem(id, fields, r={}, isNew){
  const tf = ROWT[id];
  if (tf) return `<details class="ri rc" ${isNew?"open":""}><summary>${tf(r)}<span class="chev">▾</span></summary><div class="rc-b">${rowBody(id, fields, r)}</div></details>`;
  return `<div class="ri">${rowBody(id, fields, r)}</div>`; }
function rowBody(id, fields, r){ return `${fields.length>2?`<div class="g2">${fields.filter(f=>!["ta","chk","multi","sup"].includes(f[2])).map(f=>fieldHTML(f,r[f[0]])).join("")}</div>${fields.filter(f=>["ta","chk","multi","sup"].includes(f[2])).map(f=>fieldHTML(f,r[f[0]])).join("")}`:`<div class="g2">${fields.map(f=>fieldHTML(f,r[f[0]])).join("")}</div>`}
  <div style="display:flex;gap:6px"><button type="button" class="btn btn-o" onclick="mvRow(this,-1)">▲</button><button type="button" class="btn btn-o" onclick="mvRow(this,1)">▼</button><button type="button" class="btn btn-x" onclick="if(confirm('حذف؟'))this.closest('.ri').remove()">حذف</button></div>`; }
function rows(id, fields, arr, titleFn){ ROWF[id]=fields; ROWT[id]=titleFn||null; return `<div class="rows-box" id="${id}">${arr.map(r=>rowItem(id,fields,r)).join("")}<button type="button" class="btn btn-o" onclick="addRow('${id}')">+ إضافة</button></div>`; }
const ROWF = {}, ROWT = {};
window.addRow = id => { const box=document.getElementById(id); box.lastElementChild.insertAdjacentHTML("beforebegin", rowItem(id, ROWF[id], {}, true)); };
window.mvRow = (btn, d) => { const r=btn.closest(".ri"); if(d<0 && r.previousElementSibling) r.parentNode.insertBefore(r, r.previousElementSibling); else if(d>0 && r.nextElementSibling?.classList.contains("ri")) r.parentNode.insertBefore(r.nextElementSibling, r); };
function readRows(id){
  return [...document.querySelectorAll(`#${id} .ri`)].map(ri => { const o={}; ri.querySelectorAll("[data-k]").forEach(el => {
    if (el.dataset.mv) { o[el.dataset.k] = o[el.dataset.k] || []; if (el.checked) o[el.dataset.k].push(el.dataset.mv); return; }
    o[el.dataset.k] = el.type==="checkbox" ? el.checked : el.dataset.money ? (el.value.trim()==="" ? 0 : toCents(el.value)) : el.dataset.num ? (parseFloat(el.value)||1) : el.value.trim(); }); return o; });
}

const isUSD = c => /\$|usd|usdt|دولار/i.test(String(c||""));
function priceFromCost(cost, costCur, w, cfg){
  const usd = cfg.usd || 7;
  const costLYD = isUSD(costCur) ? cost * usd : cost;
  const withProfit = costLYD * (1 + (cfg.m[w.key]||0)/100);
  if (isUSD(w.cur)) return Math.max(1, Math.round(withProfit / usd * 100));
  const c = Math.round(withProfit * 100), rnd = cfg.rnd || 1;
  return Math.max(1, rnd > 1 ? Math.ceil(c / rnd) * rnd : c);
}

    <div class="fld"><label>التصنيف</label><select class="inp" id="btT">${TYPES().map(t=>`<option value="${t.key}">${esc(t.name)}</option>`).join("")}</select></div>
    <button class="btn btn-p w" id="btB">تطبيق</button>`);
  $("#btB").onclick = () => busy($("#btB"), async () => { const t = $("#btT").value; const n = await bulkWrite((b, r) => b.update(r, { category:t, updatedAt:serverTimestamp() })); selP.clear(); closeSheet(); toast(`تم تحديث ${n} منتج ✓`,"s"); });
};
window.bulkVis = on => busy(null, async () => { const n = await bulkWrite((b, r) => b.update(r, { active:on, updatedAt:serverTimestamp() })); selP.clear(); toast(`تم ${on?"إظهار":"إخفاء"} ${n} منتج ✓`,"s"); });
window.bulkDel = () => { if (!confirm(`حذف ${selP.size} منتج نهائياً؟`)) return; busy(null, async () => { const n = await bulkWrite((b, r) => b.delete(r)); selP.clear(); toast(`تم حذف ${n} منتج`,"s"); }); };
window.selP = selP;
window.pToggle = id => { const p=D.products.find(x=>x.id===id); busy(null, ()=>updateDoc(doc(db,"products",id), { active: p.active===false })); };
window.pDel = id => { if (confirm("حذف المنتج نهائياً؟")) busy(null, async()=>{ await deleteDoc(doc(db,"products",id)); toast("تم الحذف","s"); }); };

/* banners */
window.bEdit = id => {
  const b = id ? D.banners.find(x=>x.id===id) : { active:true, sort:D.banners.length+1, cta:"اكتشف المزيد" };
  let img = b.image || "";
  const linkOpts = [["","بدون"],...TYPES().map(t=>[t.key,"تصنيف: "+t.name]),...D.products.map(p=>[p.id,"منتج: "+p.name])];
  const isUrl = /^https?:/.test(b.link||"");
  openSheet(`<h3>${id?"تعديل بانر":"بانر جديد"}<button class="btn btn-o" onclick="closeSheet()">✕</button></h3>
    <div class="fld"><label>الصورة (عرضية 2:1)</label><input class="inp" id="bf" type="file" accept="image/*"><div id="bv">${img?`<img class="preview" src="${esc(img)}">`:""}</div></div>
    <div class="fld"><label>العنوان</label><input class="inp" id="bt" value="${esc(b.title||"")}" placeholder="اشحن ألعابك الآن"></div>
    <div class="fld"><label>النص الفرعي</label><input class="inp" id="bs" value="${esc(b.subtitle||"")}" placeholder="بأسرع وأسهل طريقة"></div>
    <div class="g2"><div class="fld"><label>نص الزر</label><input class="inp" id="bc" value="${esc(b.cta||"")}"></div><div class="fld"><label>الترتيب</label><input class="inp num" id="bo" type="number" value="${esc(b.sort??"")}"></div></div>
    <div class="fld"><label>الزر يفتح</label><select class="inp" id="bl">${linkOpts.map(([k,v])=>`<option value="${esc(k)}" ${b.link===k?"selected":""}>${esc(v)}</option>`).join("")}<option value="__url" ${isUrl?"selected":""}>رابط خارجي</option></select>
      <input class="inp" id="bu" dir="ltr" style="margin-top:6px;${isUrl?"":"display:none"}" placeholder="https://..." value="${isUrl?esc(b.link):""}"></div>
    <label class="sw"><input type="checkbox" id="ba" ${b.active!==false?"checked":""}> ظاهر</label>
    <button class="btn btn-p w" id="bB">حفظ البانر</button>`);
  $("#bl").onchange = () => $("#bu").style.display = $("#bl").value==="__url" ? "" : "none";
  $("#bf").onchange = async () => { const f=$("#bf").files[0]; if(!f) return; img = await fileToDataURL(f, 1000, 600, .8); $("#bv").innerHTML=`<img class="preview" src="${img}">`; };
  $("#bB").onclick = () => busy($("#bB"), async () => {
    if (!img) throw new Error("اختر صورة للبانر");
    const link = $("#bl").value==="__url" ? $("#bu").value.trim() : $("#bl").value;
    const data = { image:img, title:$("#bt").value.trim(), subtitle:$("#bs").value.trim(), cta:$("#bc").value.trim(), link, sort:Number($("#bo").value)||0, active:$("#ba").checked, updatedAt:serverTimestamp() };
    if (id) await updateDoc(doc(db,"banners",id), data); else await addDoc(collection(db,"banners"), data);
    closeSheet(); toast("تم الحفظ ✓","s");
  });
};
window.bDel = id => { if (confirm("حذف البانر؟")) busy(null, ()=>deleteDoc(doc(db,"banners",id))); };
