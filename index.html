<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#050A16">
<title>Card Play — كارد بلاي</title>
<meta name="description" content="كارد بلاي — اشحن ألعابك واشتري بطاقاتك واشتراكاتك بأسرع وأسهل طريقة في ليبيا">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#050A16; --bg2:#081226; --card:rgba(16,30,58,.62); --card2:rgba(22,40,76,.7);
  --line:rgba(64,140,255,.22); --line2:rgba(64,140,255,.45);
  --blue:#1E7BFF; --blue2:#4AA3FF; --blue3:#0B5BD9;
  --text:#EAF2FF; --muted:#8EA3C6; --dim:#5B6E92;
  --ok:#22C55E; --warn:#F5B30B; --err:#F04B4B;
  --glow:0 0 22px rgba(30,123,255,.38);
  --r:18px; --nav:74px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Cairo',system-ui,sans-serif;color:var(--text);font-size:15px;line-height:1.55;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(30,123,255,.22),transparent 60%),
    radial-gradient(80% 50% at 100% 100%,rgba(30,123,255,.10),transparent 60%),
    linear-gradient(180deg,#060C1B,#040812 70%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.f{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative}

/* ---------- loader ---------- */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:99;transition:opacity .4s}
#boot img{width:120px;filter:drop-shadow(0 0 30px rgba(30,123,255,.6));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);opacity:.8}}

/* ---------- auth ---------- */
#auth{padding:40px 22px calc(30px + var(--safe-b));min-height:100vh;display:flex;flex-direction:column}
.auth-logo{text-align:center;margin:10px 0 26px}
.auth-logo .mk{width:118px;filter:drop-shadow(0 0 28px rgba(30,123,255,.55))}
.auth-logo .wm{display:block;width:200px;margin:14px auto 6px}
.auth-logo p{color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;color:var(--muted);transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;box-shadow:var(--glow)}

/* ---------- form ---------- */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.inp{width:100%;background:rgba(8,18,40,.75);border:1px solid var(--line);border-radius:13px;padding:12px 14px;outline:none;transition:.2s;font-size:15px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,123,255,.18)}
.inp[readonly]{opacity:.65}
textarea.inp{min-height:96px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:18px 52%,13px 52%;background-size:5px 5px;background-repeat:no-repeat}
.pw{position:relative}.pw .inp{padding-left:44px}
.pw button{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:14px;font-weight:800;font-size:15px;transition:.15s;position:relative}
.btn:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,#2C8BFF,var(--blue3));color:#fff;box-shadow:0 8px 24px -8px rgba(30,123,255,.8),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-o{border:1px solid var(--line2);background:rgba(10,22,46,.6);color:var(--text)}
.btn-g{background:#fff;color:#1b2333}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;margin:16px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.link{color:var(--blue2);font-weight:700;font-size:13px}
.err-msg{color:var(--err);font-size:13px;min-height:20px;margin:4px 2px 10px;font-weight:600}

/* ---------- app shell ---------- */
#app{padding-bottom:calc(var(--nav) + var(--safe-b) + 14px)}
.view{padding:14px 16px 10px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.bal-chip{text-align:right;color:#fff;display:flex;flex-direction:column;align-items:flex-start;padding:6px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(30,123,255,.95),rgba(11,91,217,.95));box-shadow:var(--glow);min-width:96px}
.bal-chip small{font-size:10.5px;opacity:.85;font-weight:600}
.bal-chip b{font-size:15px;font-weight:800}
.brand{display:flex;flex-direction:column;align-items:center}
.brand .mk{height:34px;filter:drop-shadow(0 0 10px rgba(30,123,255,.6))}
.brand .wm{height:13px;margin-top:3px}
.icon-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);position:relative}
.icon-btn .dot{position:absolute;top:9px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--err);box-shadow:0 0 0 2px var(--bg)}
.pagebar{display:flex;align-items:center;justify-content:center;position:relative;height:44px;margin-bottom:14px}
.pagebar h1{font-size:19px;font-weight:800}
.pagebar .back{position:absolute;right:0;top:2px}
.pagebar .act{position:absolute;left:0;top:2px}

.search{display:flex;align-items:center;gap:10px;background:rgba(10,20,42,.7);border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:14px}
.search input{flex:1;background:none;border:none;outline:none;padding:12px 0;font-size:14px}
.search svg{color:var(--muted)}

/* banners */
.banners{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 0 0 1px rgba(30,123,255,.1),0 10px 40px -12px rgba(30,123,255,.55)}
.b-track{display:flex;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.b-slide{min-width:100%;aspect-ratio:16/8;position:relative;background-size:cover;background-position:center}
.b-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(4,10,24,.85) 10%,rgba(4,10,24,.2) 70%)}
.b-txt{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:18px 20px;max-width:70%}
.b-txt h3{font-size:21px;font-weight:900;line-height:1.3}
.b-txt p{font-size:13px;color:#cfe0ff;margin:4px 0 10px}
.b-txt .cta{align-self:flex-start;background:linear-gradient(135deg,#2C8BFF,var(--blue3));padding:6px 16px;border-radius:10px;font-size:13px;font-weight:800;box-shadow:var(--glow)}
.b-def{background:
  radial-gradient(60% 90% at 15% 50%,rgba(74,163,255,.55),transparent 60%),
  radial-gradient(40% 60% at 30% 20%,rgba(30,123,255,.6),transparent 70%),
  linear-gradient(135deg,#0B1F4A,#061026)}
.b-def .art{position:absolute;left:14px;top:50%;transform:translateY(-50%) rotate(-8deg);width:38%;max-width:150px;opacity:.95;filter:drop-shadow(0 0 22px rgba(30,123,255,.7))}
.dots{display:flex;justify-content:center;gap:6px;position:absolute;bottom:9px;left:0;right:0;z-index:2}
.home-side{margin-top:14px}
.dots i{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.45);transition:.3s}
.dots i.on{width:18px;background:var(--blue)}

.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;transition:.2s}
.cat svg{width:28px;height:28px;color:var(--blue2);filter:drop-shadow(0 0 8px rgba(30,123,255,.6))}
.cat.on{border-color:var(--blue);background:linear-gradient(160deg,rgba(30,123,255,.28),rgba(16,30,58,.6));box-shadow:var(--glow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.sec-h h2{font-size:16.5px;font-weight:800}
.sec-h button{color:var(--blue2);font-size:13px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center;transition:.2s;display:flex;flex-direction:column}
.pcard:active{transform:scale(.97);border-color:var(--blue)}
.pimg{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:#0A1530}
.pph{aspect-ratio:1;display:grid;place-items:center;font-weight:900;font-size:15px;line-height:1.2;padding:8px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.pcard .meta{padding:7px 6px 9px}
.pcard .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pr{font-size:11.5px;color:var(--blue2);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
.empty svg{width:46px;height:46px;color:var(--dim);margin-bottom:8px}

/* wallet */
.wcard{position:relative;border-radius:22px;padding:22px 20px;overflow:hidden;border:1px solid rgba(110,175,255,.55);
  background:radial-gradient(90% 120% at 0% 0%,rgba(74,163,255,.55),transparent 55%),linear-gradient(135deg,#1460E0,#0A2E78 75%);
  box-shadow:0 14px 40px -12px rgba(30,123,255,.7),inset 0 1px 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:space-between}
.wcard small{font-size:13px;opacity:.85;font-weight:600}
.wcard .amt{font-size:34px;font-weight:900;line-height:1.2}
.wcard .amt span{font-size:16px;font-weight:700;margin-right:4px;opacity:.85}
.wcard .wic{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);box-shadow:0 0 24px rgba(120,190,255,.5)}
.wcard .wic svg{width:36px;height:36px}
.wcard .uid{font-size:12px;opacity:.75;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.pm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.pm{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:right}
.pm:active{border-color:var(--blue)}
.pm .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:#fff;font-weight:900;font-size:16px}
.pm small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(64,140,255,.12)}
.tx:last-child{border-bottom:none}
.tx .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:rgba(30,123,255,.14);color:var(--blue2)}
.tx .ic svg{width:20px;height:20px}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{font-size:11.5px;color:var(--muted)}
.tx .a{font-weight:800;font-size:14px}
.plus{color:var(--ok)}.minus{color:var(--err)}.pend{color:var(--warn)}.gray{color:var(--dim)}

/* orders */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;white-space:nowrap;padding:8px 14px;border-radius:12px;font-size:13.5px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.tabs button.on{background:linear-gradient(135deg,#2C8BFF,var(--blue3));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.ocard{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;width:100%;text-align:right}
.ocard .oimg{width:64px;height:64px;border-radius:14px;overflow:hidden;flex-shrink:0;border:1px solid var(--line)}
.ocard .oimg>*{width:100%;height:100%;object-fit:cover;font-size:10px;word-break:break-word}
.ocard .ob{flex:1;min-width:0}
.ocard .ob b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .ob small{display:block;font-size:12px;color:var(--muted);line-height:1.6}
.ocard .ob .p{font-weight:800;font-size:14px;margin-top:2px}
.ocard .os{align-self:flex-start}
.badge{display:inline-block;padding:3px 11px;border-radius:9px;font-size:12px;font-weight:800;border:1px solid}
.b-done{color:#4ADE80;background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.4)}
.b-pend{color:#FACC15;background:rgba(245,179,11,.13);border-color:rgba(245,179,11,.4)}
.b-proc{color:var(--blue2);background:rgba(30,123,255,.14);border-color:rgba(30,123,255,.45)}
.b-canc{color:#F87171;background:rgba(240,75,75,.13);border-color:rgba(240,75,75,.4)}

/* account */
.prof{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.ava{width:74px;height:74px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:28px;font-weight:900;
  background:radial-gradient(circle at 50% 30%,#1A3A78,#08142E);border:2px solid var(--blue);box-shadow:var(--glow);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.prof h2{font-size:19px;font-weight:800}
.prof .id{font-size:13px;color:var(--muted)}
.prof .minibal{display:inline-flex;flex-direction:column;margin-top:6px;padding:4px 14px;border-radius:11px;border:1px solid var(--line2);background:rgba(30,123,255,.1)}
.prof .minibal small{font-size:10.5px;color:var(--muted)}
.prof .minibal b{font-size:15px}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-bottom:1px solid rgba(64,140,255,.12);font-weight:700;font-size:15px}
.menu>*:last-child{border-bottom:none}
.menu .mi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(30,123,255,.14);color:var(--blue2)}
.menu .sp{flex:1;text-align:right}
.menu .chev{color:var(--dim);width:18px;height:18px}
.menu .danger{color:var(--err)}.menu .danger .mi{background:rgba(240,75,75,.12);color:var(--err)}

/* channels */
.ch{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.ch .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff}
.ch .ic svg{width:26px;height:26px}
.ch .t{flex:1;min-width:0}
.ch .t b{display:block;font-size:14.5px;font-weight:800}
.ch .t small{font-size:12.5px;color:var(--blue2);direction:ltr;display:inline-block}
.ch .go{padding:8px 16px;border-radius:11px;font-size:13px;font-weight:800;background:linear-gradient(135deg,#2C8BFF,var(--blue3));color:#fff;box-shadow:var(--glow);white-space:nowrap}
.sub{color:var(--muted);font-size:13.5px;margin:-6px 2px 14px;text-align:center}

/* support */
.faq{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.faq details{border-bottom:1px solid rgba(64,140,255,.12)}
.faq details:last-child{border-bottom:none}
.faq summary{list-style:none;padding:14px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{flex:1}
.faq summary svg{width:18px;height:18px;color:var(--muted);transition:.2s}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq details p{padding:0 16px 14px;color:var(--muted);font-size:13.5px;white-space:pre-line}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.cbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:15px;font-weight:800;border:1px solid}
.cbtn .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.cbtn small{display:block;font-size:11.5px;font-weight:600;opacity:.8}
.cbtn.wa{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.45)}.cbtn.wa .ic{background:#25D366}
.cbtn.tg{background:rgba(42,171,238,.1);border-color:rgba(42,171,238,.45)}.cbtn.tg .ic{background:#2AABEE}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:20;
  padding:8px 10px calc(8px + var(--safe-b));background:rgba(5,11,26,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--dim);padding:4px 0;position:relative}
.nav button.on{color:var(--blue2)}
.nav button.on svg{filter:drop-shadow(0 0 8px rgba(30,123,255,.9))}
.nav button.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 12px var(--blue)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,4,14,.65);backdrop-filter:blur(3px);z-index:40;opacity:0;transition:.25s;pointer-events:none}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;z-index:41;
  transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,#0C1A38,#070F22);border:1px solid var(--line2);border-bottom:none;border-radius:24px 24px 0 0;
  padding:10px 18px calc(22px + var(--safe-b));box-shadow:0 -20px 60px -20px rgba(30,123,255,.5)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--dim);margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:12px}
.ph{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ph .oimg{width:78px;height:78px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);flex-shrink:0;box-shadow:var(--glow)}
.ph .oimg>*{width:100%;height:100%;object-fit:cover}
.ph h3{margin:0}
.ph p{color:var(--muted);font-size:13px;white-space:pre-line}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.opt{padding:11px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(10,22,46,.7);text-align:center}
.opt b{display:block;font-size:14px;font-weight:800}
.opt small{color:var(--blue2);font-weight:800;font-size:13px}
.opt.on{border-color:var(--blue);background:linear-gradient(160deg,rgba(30,123,255,.3),rgba(10,22,46,.7));box-shadow:var(--glow)}
.sum{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(30,123,255,.08);border:1px dashed var(--line2);margin-bottom:12px;font-size:14px}
.sum b{font-size:17px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(64,140,255,.12);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:700;text-align:left;word-break:break-all}
.code{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.4);margin:12px 0;white-space:pre-wrap;word-break:break-all;font-weight:700}
.code div{flex:1;direction:ltr;text-align:left}
.copy{display:inline-flex;align-items:center;gap:6px;color:var(--blue2);font-weight:800;font-size:13px}
.acc-box{padding:14px;border-radius:15px;background:rgba(10,22,46,.75);border:1px solid var(--line2);margin-bottom:14px}
.acc-box .k{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acc-box .k b{font-size:17px;direction:ltr}
.acc-box p{color:var(--muted);font-size:13px;margin-top:6px;white-space:pre-line}

/* wallets */
.wl{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 8px}
.wl::-webkit-scrollbar{display:none}
.wc{flex:0 0 82%;max-width:330px;scroll-snap-align:center;position:relative;border-radius:22px;padding:16px 18px;overflow:hidden;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 34px -14px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;gap:6px;min-height:178px;text-align:right}
.wc::after{content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.08)}
.wc .wh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wc .wn{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.wc .wi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);font-weight:900;font-size:17px}
.wc .wi svg{width:22px;height:22px}
.wc small{font-size:12.5px;opacity:.85;font-weight:600}
.wc .amt{font-size:30px;font-weight:900;line-height:1.15}
.wc .amt span{font-size:15px;font-weight:700;margin-right:4px;opacity:.85}
.wc .wf{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px;position:relative;z-index:1}
.wc .def{font-size:12px;font-weight:800;padding:3px 10px;border-radius:9px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;gap:4px}
.wc .def svg{width:14px;height:14px}
.wc .mk-def{font-size:12px;font-weight:800;padding:4px 11px;border-radius:9px;border:1px solid rgba(255,255,255,.4)}
.wc .top-up{font-size:12.5px;font-weight:800;padding:5px 12px;border-radius:10px;background:#fff;color:#0b1f4a;position:relative;z-index:1}
.wsel{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.wsel::-webkit-scrollbar{display:none}
.wsel button{flex-shrink:0;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:rgba(10,22,46,.7);text-align:right;min-width:112px}
.wsel button b{display:block;font-size:13.5px;font-weight:800}
.wsel button small{font-size:12px;color:var(--muted);font-weight:700}
.wsel button.on{border-color:var(--blue);background:linear-gradient(160deg,rgba(30,123,255,.3),rgba(10,22,46,.7));box-shadow:var(--glow)}
.wsel button.on small{color:var(--blue2)}

/* ---------- desktop ---------- */
@media (hover:hover){
  .pcard:hover,.cat:hover,.pm:hover,.ocard:hover,.ch:hover{border-color:var(--line2);transform:translateY(-2px)}
  .btn-p:hover{filter:brightness(1.1)}
  .menu a:hover,.menu button:hover{background:rgba(30,123,255,.07)}
}
@media (min-width:900px){
  body{font-size:15.5px}
  .wrap{max-width:1180px}
  #app{padding:84px 0 40px}
  .view{padding:18px 28px 10px}
  .view.narrow{max-width:760px;margin:0 auto}
  .nav{top:0;bottom:auto;left:0;transform:none;max-width:none;display:flex;justify-content:center;gap:6px;padding:10px 24px;border-top:none;border-bottom:1px solid var(--line);background:rgba(5,11,26,.82)}
  .nav::before{content:"";position:absolute;right:28px;top:50%;transform:translateY(-50%);width:150px;height:40px;background:url(img/wordmark.png) right center/contain no-repeat}
  .nav button{flex-direction:row;gap:8px;font-size:15px;padding:10px 18px;border-radius:12px}
  .nav button:hover{color:var(--text);background:rgba(30,123,255,.08)}
  .nav button.on{background:rgba(30,123,255,.14)}
  .nav button.on::before{top:auto;bottom:-11px;width:60%}
  .topbar .brand{visibility:hidden}
  .home-top{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:stretch;margin-bottom:6px}
  .home-top .banners{height:100%}
  .home-top .b-slide{aspect-ratio:auto;height:100%;min-height:260px}
  .home-side{display:flex;flex-direction:column;gap:12px;margin-top:0}
  .home-side .cats{grid-template-columns:1fr;margin:0;flex:1}
  .home-side .cat{flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 18px;font-size:16px}
  .home-side .search{margin:0}
  .grid{grid-template-columns:repeat(6,1fr);gap:14px}
  .b-txt h3{font-size:30px}.b-txt p{font-size:16px}
  .wl{margin:0;padding:4px 0 8px;flex-wrap:wrap;overflow:visible}
  .wc{flex:1 1 240px;max-width:none}
  .pm-grid{grid-template-columns:repeat(4,1fr)}
  .sheet{top:50%;bottom:auto;left:50%;width:520px;max-height:86vh;border-radius:24px;border-bottom:1px solid var(--line2);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.22s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet .grab{display:none}
  #auth{justify-content:center;padding:40px 22px}
  #auth>*{width:100%;max-width:420px;margin-left:auto;margin-right:auto}
  #auth .seg,#auth form,#auth .or,#auth #gBtn{max-width:420px}
}
@media (min-width:900px) and (max-width:1100px){ .grid{grid-template-columns:repeat(5,1fr)} }

#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);z-index:60;
  padding:11px 18px;border-radius:14px;background:#0E2148;border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:700;font-size:14px;transition:.3s;max-width:92%;text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast.e{border-color:rgba(240,75,75,.6);background:#2A0F18}
#toast.s{border-color:rgba(34,197,94,.6);background:#0C2A1C}
.skel{background:linear-gradient(90deg,rgba(30,60,120,.25),rgba(60,110,200,.3),rgba(30,60,120,.25));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

function shade(hex, f){ const m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return null; const n = parseInt(m[1],16);
  const c = [n>>16, n>>8&255, n&255].map(x => Math.max(0, Math.min(255, Math.round(f>0 ? x+(255-x)*f : x*(1+f)))));
  return "#"+c.map(x=>x.toString(16).padStart(2,"0")).join(""); }
const pst = k => { const base = PM_STYLE[k] || PM_STYLE.other, col = W(k).color;

function fileToDataURL(file, maxSide, q){
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { let w = img.width, h = img.height; const r = Math.min(1, maxSide/Math.max(w,h)); w = Math.round(w*r); h = Math.round(h*r);
      const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = rej; img.src = url; });
}

/* slider */
let slideI = 0, slideT;
function slider(){
  clearInterval(slideT);
  const tr = $("#bTrack"); if (!tr) return;
  const n = tr.children.length; if (n<2) return;
  slideI = slideI % n;
  const go = i => { slideI=(i+n)%n; tr.style.transform=`translateX(${slideI*100}%)`; document.querySelectorAll("#bDots i").forEach((d,j)=>d.classList.toggle("on",j===slideI)); };
  go(slideI);
  slideT = setInterval(()=>go(slideI+1), 4500);
  let x0=null; tr.ontouchstart = e => x0 = e.touches[0].clientX;
  tr.ontouchend = e => { if (x0===null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx)>40){ go(slideI + (dx>0?1:-1)); clearInterval(slideT); slideT=setInterval(()=>go(slideI+1),4500);} x0=null; };
}

/* history */
function txHistory(){
  const items = [];
  S.topups.forEach(t => {
    const w = t.wallet || t.method, cur = t.method==="admin" ? curOf(w) : (t.cur || curOf(w)), neg = t.amount < 0;
    const wn = W(w).name;
    const title = t.method==="admin" ? (neg ? `خصم من الإدارة — ${wn}` : `إضافة رصيد — ${wn}`) : `شحن محفظة ${t.methodName||wn}`;
    const kind = neg ? "buy" : "in";
    if (t.status==="approved") items.push({ kind, t:ms(t.createdAt)||Date.now(), title, sub:fdate(t.createdAt), amt:t.amount, cur, cls:neg?"minus":"plus", icon:"wallet" });
    else if (t.status==="pending") items.push({ kind, t:ms(t.createdAt)||Date.now(), title, sub:"قيد المراجعة · "+fdate(t.createdAt), amt:t.amount, cur, cls:"pend", icon:"history" });
    else items.push({ kind, t:ms(t.createdAt), title, sub:"مرفوض"+(t.adminNote?` · ${t.adminNote}`:""), amt:t.amount, cur, cls:"gray", icon:"wallet" });
  });
  S.orders.forEach(o => {
    const cur = o.cur || "د.ل";
    items.push({ kind:"buy", t:ms(o.createdAt)||Date.now(), title:`شراء ${o.productName}`, sub:`${iso(o.optionLabel||"")} · ${o.wallet?W(o.wallet).name+" · ":""}${fdate(o.createdAt)}`, amt:-o.price, cur, cls:"minus", icon:"cart" });
    if (o.status==="cancelled" && o.refunded) items.push({ kind:"in", t:ms(o.updatedAt)||ms(o.createdAt), title:`استرجاع — ${o.productName}`, sub:fdate(o.updatedAt), amt:o.price, cur, cls:"plus", icon:"history" });
  });
  return items.sort((a,b)=>b.t-a.t);
}
function txList(items){
  if (!items.length) return `<div class="empty">${ic("history")}<div>لا توجد عمليات بعد</div></div>`;

let selOpt = 0;
window.openProduct = id => {

  const firstOk = () => Math.max(0, opts.findIndex(o => priceFor(o,wk) > 0));
  selOpt = firstOk();
  openSheet(`

    ${opts.length ? `<div class="fld"><label>اختر الباقة</label></div><div class="opts" id="pOpts"></div>` : `<div class="empty">لا توجد باقات متاحة</div>`}

    <button class="btn btn-p" id="buyBtn"></button>`);
  const upd = () => {
    const cur = curOf(wk);
    $("#pW").innerHTML = pays().map(w => `<button class="${w.key===wk?"on":""}" data-w="${esc(w.key)}"><b>${esc(w.name)}</b><small>${money(wbal(w.key), curOf(w.key))}</small></button>`).join("");
    document.querySelectorAll("#pW [data-w]").forEach(b => b.onclick = () => { wk = b.dataset.w; if (priceFor(opts[selOpt],wk)<=0) selOpt = firstOk(); upd(); setDefW(wk, true); });
    $("#pBal").innerHTML = `رصيد ${esc(W(wk).name)}: ${money(wbal(wk), cur)}`;
    const btn = $("#buyBtn");
    if (!opts.length) { btn.disabled = true; btn.textContent = "غير متاح"; return; }
    $("#pOpts").innerHTML = opts.map((o,i)=>{ const pr = priceFor(o,wk);
      return `<button class="opt ${i===selOpt&&pr>0?"on":""}" data-i="${i}" ${pr>0?"":'disabled style="opacity:.4"'}><b>${iso(esc(o.label))}</b><small>${pr>0?money(pr, cur):"غير متوفر"}</small></button>`; }).join("");
    document.querySelectorAll("#pOpts .opt:not([disabled])").forEach(b => b.onclick = () => { selOpt=+b.dataset.i; upd(); });
    const price = priceFor(opts[selOpt], wk);
    if (!(price > 0)) { $("#pTot").textContent = "—"; btn.disabled = true; btn.textContent = `غير متوفر بمحفظة ${W(wk).name}`; return; }
    btn.disabled = false;
    $("#pTot").innerHTML = money(price, cur);
    const ok = wbal(wk) >= price;
    btn.innerHTML = ok ? `${ic("cart")} تأكيد الشراء` : `${ic("plus")} رصيد ${esc(W(wk).name)} غير كافي — اشحن الآن`;
    btn.onclick = ok ? () => buy(p, selOpt, wk) : () => { closeSheet(); setTimeout(()=>openTopup(wk),350); };
  };
  upd();
};
async function buy(p, i, wk){
  const input = $("#pIn")?.value.trim() || "";
  if (p.needsInput && !input) return toast(`اكتب ${p.inputLabel||"ID اللاعب"}`,"e");
  const btn = $("#buyBtn"); busy(btn,true);
  const uref = doc(db,"users",S.user.uid), oref = doc(collection(db,"orders"));
  try {
    await runTransaction(db, async tx => {
      const us = await tx.get(uref), ps = await tx.get(doc(db,"products",p.id));
      if (!ps.exists() || ps.data().active===false) throw new Error("المنتج غير متاح حالياً");
      const pd = ps.data(), o = (pd.options||[])[i]; if (!o) throw new Error("الباقة غير متاحة");
      const price = priceFor(o, wk);
      if (!(price > 0)) throw new Error("الباقة غير متوفرة بهذه المحفظة");
      const bal = Number((us.data().wallets||{})[wk]) || 0;
      if (bal < price) throw new Error("رصيد المحفظة غير كافي");
      tx.set(oref, { uid:S.user.uid, uName:S.me?.name||"", uShort:S.me?.short||"", productId:p.id, productName:pd.name,
        optionIndex:i, optionLabel:o.label, price, wallet:wk, cur:curOf(wk), input, no:String(Date.now()).slice(-7),
        status:"pending", createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
      tx.update(uref, { ["wallets."+wk]: bal - price, lastOrder: oref.id });
    });
    pingAdmin("orders", oref.id);
    closeSheet(); toast("تم استلام طلبك ✓ سيتم تنفيذه قريباً","s"); S.otab="all"; location.hash="#orders";
  } catch (e) { console.error(e); toast(e.message?.length<60 && !/permission|FirebaseError/i.test(e.message) ? e.message : "تعذر إتمام الطلب، حاول مرة أخرى","e"); busy(btn,false); }
}

    try {
      const tref = await addDoc(collection(db,"topups"), { uid:S.user.uid, uName:S.me?.name||"", uShort:S.me?.short||"", method:cur.key, methodName:cur.name,
        wallet:cur.key, cur:cc, amount, fields, shot, note:$("#tpNote").value.trim(), status:"pending", createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
      pingAdmin("topups", tref.id);
      closeSheet(); toast("تم إرسال طلب الشحن ✓ قيد المراجعة","s");
    } catch(err){ console.error(err); toast("تعذر الإرسال، حاول مرة أخرى","e"); busy(btn,false); }
  };
};

/* admin alert ping */
function pingAdmin(type, id){
  const u = S.settings?.push?.worker; if (!u || !/^https:\/\//.test(u)) return;
  try { fetch(u, { method:"POST", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify({ type, id }), keepalive:true }).catch(()=>{}); } catch {}
}

/* tickets */
async function sendTicket(e){
  e.preventDefault();
  const msg = $("#tkMsg").value.trim(); if (msg.length<5) return toast("اكتب رسالتك بالتفصيل","e");
  const btn = $("#tkBtn"); busy(btn,true);
  try {
    await addDoc(collection(db,"tickets"), { uid:S.user.uid, uName:S.me?.name||"", uShort:S.me?.short||"", type:$("#tkType").value, message:msg,
      status:"open", reply:"", createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
    $("#tkMsg").value=""; toast("تم إرسال التذكرة ✓ سنرد عليك قريباً","s");
  } catch(err){ console.error(err); toast("تعذر الإرسال","e"); }
  busy(btn,false);
}

/* info */
async function saveInfo(e){
  e.preventDefault();
  const name = $("#iName").value.trim(), phone = $("#iPhone").value.trim(), pass = $("#iPass")?.value || "";
  if (name.length<2) return toast("اكتب اسمك","e");
  const btn = $("#iBtn"); busy(btn,true);
  try {
    await updateDoc(doc(db,"users",S.user.uid), { name, phone });
    if (pass) { if (pass.length<6) throw { code:"auth/weak-password" }; await updatePassword(S.user, pass); $("#iPass").value=""; }
    toast("تم حفظ التغييرات ✓","s");
  } catch(err){ console.error(err); toast(err.code ? aerr(err) : "تعذر الحفظ","e"); }
  busy(btn,false);
}

</script>
